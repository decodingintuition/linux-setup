[ids]

*

[main]

# Caps Lock: tap = Escape, hold = Control
capslock = overload(control, esc)

# Right Control → Control+Alt for Emacs Control+Meta shortcuts.
rightcontrol = layer(control_alt)

# Match the keyboard's physical Left Super and Left Alt labels.
leftalt = layer(meta)
leftmeta = layer(alt)

# Keys emitting Right Super → F24 → Hyper/Mod3 in Hyprland keymap-mod3.xkb.
rightmeta = f24

[control_alt:C-A]

[meta]

# Left Super + HJKL → Arrow keys (system-wide)
h = left
j = down
k = up
l = right
